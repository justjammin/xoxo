name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION."
            exit 1
          fi
          echo "value=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: registry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "xoxo-eval@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "xoxo-eval@$PACKAGE_VERSION is already published; verification will continue without republishing."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked dependencies
        run: bun ci

      - name: Test and build
        run: bun run check

      - name: Publish with trusted publishing
        if: steps.registry.outputs.published != 'true'
        run: npm publish
